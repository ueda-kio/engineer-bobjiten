pre-commit:
  parallel: false
  commands:
    1_lint:
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    2_format:
      glob: '*.{js,jsx,ts,tsx,json,jsonc,css,md,yml,yaml}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm exec tsc -b --noEmit
    test:
      run: pnpm exec vitest run --reporter=dot
